<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: rgb(242, 242, 242);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .profile-card {
      width: 320px;
      background-color: rgb(255, 255, 255);
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      text-align: center;
    }

    .profile-card header {
      background-color: rgb(76, 174, 79);
      color: rgb(255, 255, 255);
      padding: 25px 20px;
    }

    .profile-card h2 {
      font-size: 28px;
      font-weight: bold;
    }

    .profile-card p {
      color: rgb(85, 85, 85);
      font-size: 17px;
      line-height: 1.6;
      padding: 20px 25px 30px;
    }

    .profile-card .button {
      background-color: rgb(76, 174, 79);
      color: rgb(255, 255, 255);
      border: none;
      border-radius: 8px;
      padding: 12px 30px;
      font-size: 17px;
      cursor: pointer;
      margin-bottom: 25px;
    }

    .profile-card .button:hover {
      background-color: rgb(69, 170, 63);
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <header>
      <h2>John Doe</h2>
    </header>
    <p>Web Developer at XYZ Company. Loves coding and coffee.</p>
    <button class="button">Contact</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
