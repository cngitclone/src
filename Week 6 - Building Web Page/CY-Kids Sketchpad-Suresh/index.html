<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suresh's Kids' Sketch Pad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; }
    /* Canvas must sit at the exact top-left of the viewport so that
       page mouse coordinates == canvas pixel coordinates for the tests */
    #sketchPad {
      display: block;
      background-color: #fff;
      outline: 1px solid #000; /* outline, not border: keeps offsetX/Y aligned */
    }
    .controls { margin: 15px; }
  </style>
</head>
<body>
  <canvas id="sketchPad" width="500" height="300"></canvas>

  <div class="controls">
    <h2>Suresh's Kids' Sketch Pad</h2>
    <div class="d-flex gap-2 flex-wrap">
      <button id="defaultBtn" class="btn btn-dark">Default</button>
      <button id="redBtn" class="btn btn-danger">Red</button>
      <button id="blueBtn" class="btn btn-primary">Blue</button>
      <button id="greenBtn" class="btn btn-success">Green</button>
      <button id="eraserBtn" class="btn btn-secondary">Eraser</button>
      <button id="clearBtn" class="btn btn-warning">Clear Canvas</button>
    </div>
    <p class="mt-3">Current Drawing Color: <strong id="currentColor">Black</strong></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const canvas = document.getElementById('sketchPad');
      const ctx = canvas.getContext('2d');
      const currentColorDisplay = document.getElementById('currentColor');

      // white background so cleared/untouched areas read as rgb(255,255,255)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let drawing = false;

      function setColor(color, label) {
        ctx.strokeStyle = color;
        currentColorDisplay.textContent = label;
      }

      canvas.addEventListener('mousedown', function (e) {
        drawing = true;
        ctx.beginPath();
        ctx.moveTo(e.offsetX, e.offsetY);
      });

      canvas.addEventListener('mousemove', function (e) {
        if (!drawing) return;
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
      });

      canvas.addEventListener('mouseup', function () {
        drawing = false;
      });

      canvas.addEventListener('mouseout', function () {
        drawing = false;
      });

      document.getElementById('defaultBtn').addEventListener('click', function () {
        setColor('#000000', 'Black');
      });
      document.getElementById('redBtn').addEventListener('click', function () {
        setColor('#ff0000', 'Red');
      });
      document.getElementById('blueBtn').addEventListener('click', function () {
        setColor('#0000ff', 'Blue');
      });
      document.getElementById('greenBtn').addEventListener('click', function () {
        setColor('#008000', 'Green');
      });
      document.getElementById('eraserBtn').addEventListener('click', function () {
        setColor('#ffffff', 'White (Eraser)');
      });

      document.getElementById('clearBtn').addEventListener('click', function () {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      });
    });
  </script>
</body>
</html>
