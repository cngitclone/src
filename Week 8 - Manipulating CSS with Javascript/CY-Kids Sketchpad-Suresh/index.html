<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suresh's Kids' Sketch Pad</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Canvas placed at top-left to map perfectly to Puppeteer coordinates -->
    <canvas id="sketchPad" width="500" height="300"></canvas>
    
    <div class="content-wrapper p-4">
        <h2>Suresh's Kids' Sketch Pad</h2>
        
        <!-- Controls -->
        <div class="controls mb-3 mt-3">
            <button id="defaultBtn" class="btn btn-dark">Default</button>
            <button id="redBtn" class="btn btn-danger">Red</button>
            <button id="blueBtn" class="btn btn-primary">Blue</button>
            <button id="greenBtn" class="btn btn-success">Green</button>
            <button id="eraserBtn" class="btn btn-secondary">Eraser</button>
            <button id="clearBtn" class="btn btn-warning text-dark">Clear Canvas</button>
        </div>

        <!-- Current Color Display -->
        <p>Current Drawing Color: <strong id="currentColor">Black</strong></p>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
