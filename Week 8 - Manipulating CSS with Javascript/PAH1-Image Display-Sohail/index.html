<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Showcase</title>
    <!-- Link to Bootstrap 5 CSS for styling control buttons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Link to your external style.css file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-5 text-center">

    <!-- Control Buttons -->
    <!-- Recreating the mockup's button container and distinct styling -->
    <div class="d-flex justify-content-center gap-2 mb-4">
        <button id="btn1" class="btn btn-primary">Image 1</button>
        <button id="btn2" class="btn btn-success">Image 2</button>
        <button id="btn3" class="btn btn-danger">Image 3</button>
    </div>

    <!-- Image Display -->
    <!-- Images inside a div with class image-container, as required by test script -->
    <div class="image-container mx-auto">
        <img src="img1.jpg" id="img1" class="layered-img" alt="Landscape 1">
        <img src="img2.jpg" id="img2" class="layered-img" alt="Landscape 2">
        <img src="img3.jpg" id="img3" class="layered-img" alt="Landscape 3">
    </div>

    <!-- Link to your external script.js file at the bottom of the body -->
    <script src="script.js"></script>
</body>
</html>
